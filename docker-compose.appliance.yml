# Appliance (enterprise) reference composition for local development. Sign-in requires AMO_ENTRA_TENANT_ID/CLIENT_ID (the image runs in production mode and refuses to start without them);
# discovery uses AMO_CREDENTIAL_KIND=azure-cli locally (mount ~/.azure) or the fixture (AMO_DISCOVERY_FIXTURE=1).
# In Azure, run from infrastructure/terraform/appliance-azure instead (Container Apps + managed identity).
services:
  appliance-api:
    build: { context: ., dockerfile: infrastructure/docker/Dockerfile.appliance }
    environment:
      AMO_ENTRA_TENANT_ID: "${AMO_ENTRA_TENANT_ID:-}"
      AMO_ENTRA_CLIENT_ID: "${AMO_ENTRA_CLIENT_ID:-}"
      AMO_CREDENTIAL_KIND: "${AMO_CREDENTIAL_KIND:-azure-cli}"
      AMO_DISCOVERY_FIXTURE: "${AMO_DISCOVERY_FIXTURE:-0}"
      AMO_ENTRA_AUDIENCE: "${AMO_ENTRA_AUDIENCE:-}"
      AMO_ALLOWED_ORIGINS: "${AMO_ALLOWED_ORIGINS:-}"
      # Refuses a request whose Host name is not one of these (DNS rebinding). Change it if you publish another port.
      AMO_ALLOW_SELF_APPROVAL: "${AMO_ALLOW_SELF_APPROVAL:-}"
      AMO_ALLOWED_HOSTS: "${AMO_ALLOWED_HOSTS:-localhost:8081,127.0.0.1:8081,[::1]:8081}"
      DATABASE_URL: "postgres://amo@postgres:5432/amo?sslmode=disable"
    # Bound to this machine only: the local database below trusts every connection, so the API must not be reachable from the network.
    ports: ["127.0.0.1:8081:8081"]
    depends_on: [postgres]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  worker:
    build: { context: ., dockerfile: infrastructure/docker/Dockerfile.appliance }
    command: ["node", "apps/worker/dist/main.js"]
    environment:
      AMO_ENTRA_TENANT_ID: "${AMO_ENTRA_TENANT_ID:-}"
      AMO_CREDENTIAL_KIND: "${AMO_CREDENTIAL_KIND:-azure-cli}"
      DATABASE_URL: "postgres://amo@postgres:5432/amo?sslmode=disable"
    depends_on: [postgres]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  postgres:
    image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    environment:
      POSTGRES_USER: amo
      POSTGRES_DB: amo
      POSTGRES_HOST_AUTH_METHOD: trust  # local development only; use managed identity / Key Vault in Azure
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes: { pgdata: {} }
