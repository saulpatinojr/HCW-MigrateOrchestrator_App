version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups: { dev: { dependency-type: development } }
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule: { interval: weekly }
    # One pull request for every Actions pin: codeql-action init and analyze must move together (#32 bumped init
    # alone and failed the CodeQL upload), as the downstream edition already does.
    groups:
      all-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /infrastructure/docker
    schedule: { interval: weekly }
  # The appliance compose file (postgres) lives at the repository root; the docker entry above only reads the Dockerfile.
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
