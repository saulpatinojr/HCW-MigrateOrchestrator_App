name: Self-merging pull request
description: >
  Turns the files the calling job already changed in its working tree into one pull request
  on a fixed branch, opened with a short-lived GitHub App token so the required checks run,
  and (by default) turns on squash auto-merge and waits for the merge. The same file lives in
  every HCW application repository; change it in one, copy it to the others.

# Why an App token. `main` is protected by a ruleset that requires a pull request, the
# `github-actions` account cannot be put on a ruleset bypass list, and "Allow GitHub Actions
# to create and approve pull requests" is off. A pull request opened with GITHUB_TOKEN would
# also not start the required checks, so it could never merge. The token is minted for the
# current repository only, with Contents and Pull requests write, and expires with the job.
#
# The caller must check out with `persist-credentials: false` (create-pull-request pushes with
# its own token; a persisted header beside it makes git send two and GitHub answers 400) and
# must grant at least `contents: read`.

inputs:
  client-id:
    description: Client ID of the GitHub App.
    required: true
  private-key:
    description: Private key of the GitHub App. Pass it from a secret.
    required: true
  branch:
    description: >
      The one branch used for this kind of change. A later run updates the same pull request
      instead of opening a second one, so the newest content wins.
    required: true
  title:
    description: Pull request title and commit message. Do not put [skip ci] in it - that also skips the required checks.
    required: true
  body:
    description: Pull request description.
    required: false
    default: ""
  add-paths:
    description: Paths to commit, one per line. Nothing else in the working tree is committed.
    required: true
  labels:
    description: Labels to put on the pull request, one per line. They must already exist.
    required: false
    default: ""
  auto-merge:
    description: "'true' turns on squash auto-merge and waits for the merge. 'false' only opens the pull request (a report that a person reviews)."
    required: false
    default: "true"
  wait-minutes:
    description: How long to wait for the merge. A timeout is a warning, never a failure.
    required: false
    default: "30"
  rehearsal:
    description: >
      'true' proves the plumbing and leaves nothing behind: open the pull request, turn on
      auto-merge, confirm the required checks start, then close the pull request and delete
      the branch. Implies it does not wait for a merge.
    required: false
    default: "false"

outputs:
  pull-request-number:
    description: Number of the pull request, empty when there was nothing to commit.
    value: ${{ steps.pr.outputs.pull-request-number }}
  merged:
    description: "'true' when the pull request merged before the wait ended."
    value: ${{ steps.finish.outputs.merged }}

runs:
  using: composite
  steps:
    - name: GitHub App token (this repository only)
      id: app-token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        permission-contents: write
        permission-pull-requests: write

    - name: Open or update the pull request
      id: pr
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
      with:
        token: ${{ steps.app-token.outputs.token }}
        branch: ${{ inputs.branch }}
        add-paths: ${{ inputs.add-paths }}
        commit-message: ${{ inputs.title }}
        title: ${{ inputs.title }}
        body: ${{ inputs.body }}
        labels: ${{ inputs.labels }}
        delete-branch: true

    - name: Merge when the required checks pass, or rehearse
      id: finish
      if: steps.pr.outputs.pull-request-number != ''
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        REPO: ${{ github.repository }}
        AUTO_MERGE: ${{ inputs.auto-merge }}
        WAIT_MINUTES: ${{ inputs.wait-minutes }}
        REHEARSAL: ${{ inputs.rehearsal }}
      run: |
        set -u
        echo "merged=false" >> "$GITHUB_OUTPUT"

        if [ "$AUTO_MERGE" != "true" ] && [ "$REHEARSAL" != "true" ]; then
          echo "Pull request #${PR_NUMBER} is open for review; auto-merge was not requested."
          exit 0
        fi

        # Idempotent: enabling auto-merge twice is harmless. A failure is reported, not hidden.
        if ! gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --auto; then
          echo "::warning::Could not enable auto-merge on pull request #${PR_NUMBER}; merge it by hand."
          [ "$REHEARSAL" = "true" ] && { echo "::error::Rehearsal failed: auto-merge could not be enabled."; exit 1; }
          exit 0
        fi

        if [ "$REHEARSAL" = "true" ]; then
          # Prove that the required checks start on a pull request this App opened.
          for _ in $(seq 1 40); do
            COUNT=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json statusCheckRollup --jq '.statusCheckRollup | length' || echo 0)
            [ "${COUNT:-0}" -gt 0 ] && break
            sleep 15
          done
          AUTO=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json autoMergeRequest --jq '.autoMergeRequest.mergeMethod // "none"' || echo unknown)
          echo "Checks started: ${COUNT:-0}; auto-merge method: ${AUTO}."
          gh pr close "$PR_NUMBER" --repo "$REPO" --delete-branch \
            --comment "Rehearsal finished: the App token, pull request, auto-merge and required checks all worked. Closed without merging." || true
          if [ "${COUNT:-0}" -eq 0 ]; then
            echo "::error::Rehearsal failed: no required check started within 10 minutes."
            exit 1
          fi
          echo "Rehearsal passed."
          exit 0
        fi

        # Hold the caller until the change is on the default branch. Bounded, never a failure.
        ATTEMPTS=$(( WAIT_MINUTES * 2 ))
        for _ in $(seq 1 "$ATTEMPTS"); do
          STATE=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state --jq .state || echo UNKNOWN)   # a transient API error must not end the wait
          case "$STATE" in
            MERGED) echo "Pull request #${PR_NUMBER} merged."; echo "merged=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            CLOSED) echo "::warning::Pull request #${PR_NUMBER} was closed without merging."; exit 0 ;;
          esac
          sleep 30
        done
        echo "::warning::Pull request #${PR_NUMBER} had not merged after ${WAIT_MINUTES} minutes; check its required checks."
