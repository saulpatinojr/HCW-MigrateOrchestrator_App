# Actions are pinned to full commit SHAs (version in the trailing comment); Dependabot (github-actions ecosystem) proposes updates.
name: iac-validate
on:
  pull_request:
    paths: ["infrastructure/terraform/**", ".github/workflows/iac-validate.yml"]
  push:
    branches: [main]
    paths: ["infrastructure/terraform/**"]
permissions:
  contents: read
jobs:
  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [infrastructure/terraform/appliance-azure]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: "1.9.8" }
      - run: terraform -chdir=${{ matrix.dir }} fmt -recursive -check -diff
      - run: terraform -chdir=${{ matrix.dir }} init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=${{ matrix.dir }} validate -no-color
      # Plan-only tests with mocked providers (tests/*.tftest.hcl): no cloud, no credentials, nothing is applied.
      - run: terraform -chdir=${{ matrix.dir }} test -no-color
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: config, scan-ref: "${{ matrix.dir }}", exit-code: "1", severity: "HIGH,CRITICAL" }
      # checkov (issue 53): fails on any finding. The two findings that are decisions, not defects, are skipped in main.tf with
      # a written reason each (checkov:skip comments on the database server, ADR-0032 sections 3 and 4); a new finding fails the job.
      # Pinned by version; pipx is preinstalled on GitHub-hosted runners. Reads files only, nothing is applied.
      - name: checkov
        env:
          SCAN_DIR: ${{ matrix.dir }}
        run: pipx run --spec checkov==3.3.30 checkov --directory "$SCAN_DIR" --framework terraform --compact --quiet
