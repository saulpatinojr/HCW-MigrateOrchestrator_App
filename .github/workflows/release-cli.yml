# Actions are pinned to full commit SHAs (version in the trailing comment); Dependabot (github-actions ecosystem) proposes updates.
# On every v* tag the GitHub Release carries two kinds of artifact: the single-executable `amo` CLI (Node SEA) for Linux,
# macOS and Windows with checksums (job `sea`), and the two npm package tarballs `hybridcloudworks-migration-core-<version>.tgz`
# and `hybridcloudworks-migration-ui-<version>.tgz` (job `packages`). The downstream edition (HCW-MigrateOrchestrator_AddOn)
# pins the tarballs by URL and integrity hash, so no registry stands between a release and its adoption; npm trusted
# publishing (publish-npm.yml) stays optional. Both jobs attest provenance.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  sea:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26, cache: npm }
      - run: npm ci && npm run build
      - run: bash scripts/build-sea.sh
        shell: bash
      - name: Smoke test (the one binary; checksum files are skipped)
        shell: bash
        run: |
          set -euo pipefail
          for b in dist-sea/amo-*; do
            case "$b" in *.txt) continue ;; esac
            echo "running $b"
            "$b" rules validate
            "$b" assess --csv samples/resources-csv/sample-resources.csv --out "$RUNNER_TEMP/smoke" --region westus3 > /dev/null
            test -f "$RUNNER_TEMP/smoke/reports/resource-decisions.csv"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-sea/amo-*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: amo-${{ matrix.os }}
          path: dist-sea/*
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist-sea/*

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26, cache: npm }
      - run: npm ci && npm run build
      - name: The tag names the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"; exit 1; }
      - name: Pack the two packages
        run: |
          set -euo pipefail
          mkdir -p dist-tarballs
          (cd dist-packages/migration-core && npm pack --pack-destination ../../dist-tarballs)
          (cd dist-packages/migration-ui && npm pack --pack-destination ../../dist-tarballs)
          ls -l dist-tarballs
          test -f dist-tarballs/hybridcloudworks-migration-core-*.tgz
          test -f dist-tarballs/hybridcloudworks-migration-ui-*.tgz
      - name: Clean-consumer gate against the assembled packages
        run: npm run packages:verify
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-tarballs/*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-tarballs
          path: dist-tarballs/*.tgz
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist-tarballs/*.tgz
