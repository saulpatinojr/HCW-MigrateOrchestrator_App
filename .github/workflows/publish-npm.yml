# Actions are pinned to full commit SHAs (version in the trailing comment); Dependabot (github-actions ecosystem) proposes updates.
# Publishes @hybridcloudworks/migration-core and @hybridcloudworks/migration-ui with npm trusted publishing (OIDC, provenance).
# No npm token is stored anywhere. Gated on the repository variable NPM_TRUSTED_PUBLISHING=ready, which the owner sets after the
# one-time registry bootstrap described in docs/release/npm-publishing.md. Until then this workflow is skipped, not failed.
# Three jobs, so the publishing permission exists only where something is published, and only the files that were released are
# published (ADR-0034, follow-up F5 of issue 83):
#   verify         (contents: read)  the tag, every version and the commit must agree (scripts/check-release-version.mjs) and npm must
#                                    be new enough for trusted publishing, then build, assemble at that version and run the
#                                    clean-consumer gate (a rehearsal: nothing built here is published). Nothing is published here.
#   release-ready  (contents and attestations: read; a tag only)  waits for the GitHub Release of the tag to be public, downloads
#                                    it, and checks the files, the digests GitHub reports and the signed attestations of every
#                                    file (this workflow file's sibling release-cli.yml, this tag, this commit:
#                                    scripts/release-publish.mjs verify-release). It hands the two tarballs and their sha256 on.
#   publish        (id-token: write; a tag only; GitHub Environment npm-publish, which should require reviewers)  publishes the
#                                    very tarballs that were released and attested, after checking their sha256 again: core
#                                    first, then ui. What reaches npm is byte for byte what the release carries.
# This workflow and release-cli.yml (and publish-images.yml) start from the same tag and run independently: none is a job of
# another. The difference from before: publish-npm now waits (up to 45 minutes) for the release to be public and verified, so npm
# can no longer publish when the release run fails. Each workflow still runs its own check first.
# npm is the one that ships with Node 26 (setup-node `node-version: 26`); the workflow does not install `npm@latest`. If a Node
# release ever bundles an npm older than 11.5.1, `verify` fails with a clear message instead of publishing without provenance.
# Dry run: Actions, publish-npm, Run workflow, on the main branch only (any other ref fails at once). It runs `verify` and stops:
# the other jobs run only for a pushed v* tag, so a manual run can never publish, whatever ref it names.
# A re-run never replaces a published version: npm refuses to publish a version that exists. If `publish` fails after migration-core
# went out and before migration-ui did, the next patch version is the way forward (a version cannot be reused).
name: publish-npm
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: vars.NPM_TRUSTED_PUBLISHING == 'ready'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.guard.outputs.version }}
    steps:
      - name: A manual run is only allowed on main
        if: github.event_name != 'push' && github.ref != 'refs/heads/main'
        env: { REF: "${{ github.ref }}" }
        run: |
          echo "::error::the dry run runs on the main branch only (this run is on $REF): Run workflow, Branch: main"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26, package-manager-cache: false, registry-url: "https://registry.npmjs.org" }
      - id: guard
        name: The tag and every version agree, the commit is on main, and npm supports trusted publishing (>= 11.5.1)
        env: { EVENT_NAME: "${{ github.event_name }}", REF_NAME: "${{ github.ref_name }}" }
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then mode=(--tag "$REF_NAME"); else mode=(--rehearse); fi
          node scripts/check-release-version.mjs "${mode[@]}" --ancestor-of origin/main --require-npm 11.5.1
      - run: npm ci
      - name: Build and assemble at the package version (a rehearsal, because what is published is the released tarballs)
        env: { VERSION: "${{ steps.guard.outputs.version }}" }
        run: |
          npx tsc -b tsconfig.build.json
          node scripts/assemble-packages.mjs --version "$VERSION"
      - name: Clean-consumer gate
        run: node scripts/verify-packed-consumer.mjs

  release-ready:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.NPM_TRUSTED_PUBLISHING == 'ready'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      attestations: read # to verify the attestations of the released files
    outputs:
      core_sha256: ${{ steps.digests.outputs.core }}
      ui_sha256: ${{ steps.digests.outputs.ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26, package-manager-cache: false }
      - name: Wait for the GitHub Release of this tag to be public (release-cli.yml makes it public last; a draft is not visible to this job)
        env: { GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}", TAG: "${{ github.ref_name }}" }
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            state="$(gh release view "$TAG" --repo "$GH_REPO" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
            if [ "$state" = "false" ]; then echo "the release $TAG is public (check $attempt)"; exit 0; fi
            echo "waiting for the public release $TAG (check $attempt of 90)"
            sleep 30
          done
          echo "::error::the release $TAG was not public after 45 minutes, so nothing was published to npm. Look at the release-cli run for this tag; once the release is public, re-run this workflow's failed jobs."
          exit 1
      - name: Download the public release and verify its files, digests and attestations (this workflow, this tag, this commit)
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
          TAG: "${{ github.ref_name }}"
          SOURCE_REF: "${{ github.ref }}"
          SOURCE_DIGEST: "${{ github.sha }}"
        run: |
          node scripts/release-publish.mjs verify-release --repo "$GH_REPO" --tag "$TAG" --out released \
            --workflow .github/workflows/release-cli.yml --source-ref "$SOURCE_REF" --source-digest "$SOURCE_DIGEST"
      - id: digests
        name: Keep the two released tarballs and record their sha256
        env: { TAG: "${{ github.ref_name }}" }
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p tarballs
          cp "released/hybridcloudworks-migration-core-${version}.tgz" "released/hybridcloudworks-migration-ui-${version}.tgz" tarballs/
          echo "core=$(sha256sum "tarballs/hybridcloudworks-migration-core-${version}.tgz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "ui=$(sha256sum "tarballs/hybridcloudworks-migration-ui-${version}.tgz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: released-tarballs
          path: tarballs/*
          if-no-files-found: error

  publish:
    needs: [verify, release-ready]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.NPM_TRUSTED_PUBLISHING == 'ready'
    runs-on: ubuntu-latest
    # A GitHub Environment with required reviewers is the human gate before anything reaches npm (docs/release/npm-publishing.md,
    # step 4). Without that setup the environment is created empty on first use and the job runs without waiting for anyone.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm trusted publishing and the provenance signature
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26, package-manager-cache: false, registry-url: "https://registry.npmjs.org" }
      - name: The tag still names the package version, and npm supports trusted publishing
        env: { REF_NAME: "${{ github.ref_name }}" }
        run: node scripts/check-release-version.mjs --tag "$REF_NAME" --require-npm 11.5.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: released-tarballs, path: tarballs }
      - name: The tarballs are exactly the ones that were verified against the release and its attestations
        env:
          VERSION: "${{ needs.verify.outputs.version }}"
          CORE_SHA256: "${{ needs.release-ready.outputs.core_sha256 }}"
          UI_SHA256: "${{ needs.release-ready.outputs.ui_sha256 }}"
        run: |
          set -euo pipefail
          ls -l tarballs
          test "$(sha256sum "tarballs/hybridcloudworks-migration-core-${VERSION}.tgz" | cut -d' ' -f1)" = "$CORE_SHA256"
          test "$(sha256sum "tarballs/hybridcloudworks-migration-ui-${VERSION}.tgz" | cut -d' ' -f1)" = "$UI_SHA256"
      - name: Publish migration-core (the released tarball)
        env: { VERSION: "${{ needs.verify.outputs.version }}" }
        run: npm publish "tarballs/hybridcloudworks-migration-core-${VERSION}.tgz" --access public --provenance
      - name: Publish migration-ui (the released tarball)
        env: { VERSION: "${{ needs.verify.outputs.version }}" }
        run: npm publish "tarballs/hybridcloudworks-migration-ui-${VERSION}.tgz" --access public --provenance
