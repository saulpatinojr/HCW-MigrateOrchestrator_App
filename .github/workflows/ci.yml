# Actions are pinned to full commit SHAs (version in the trailing comment); Dependabot (github-actions ecosystem) proposes updates.
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run rules:validate
      - name: Build appliance web (Vite + Tailwind)
        run: npm run web:build
        env: { VITE_ENTRA_TENANT_ID: ci, VITE_ENTRA_SPA_CLIENT_ID: ci, VITE_API_SCOPE: ci }
      - name: Package repository ZIP (artifact)
        run: bash scripts/package-repository.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: hcw-azmigrateorchestrator-app, path: hcw-azmigrateorchestrator-app.zip, retention-days: 7 }

      # Workflow and Dockerfile linters (HCW-HybridCloudWorks#1575): the
      # same three tools, versions and digests as the website's CI. CodeRabbit
      # used to run them and was removed on 2026-11-06. Each tool is a pinned
      # release whose SHA-256 is written here; move a version and its digest
      # together. Each linter runs even when the one before it failed, so one
      # run shows every finding.
      # zizmor is a Python program. Its environment below is made from Python
      # 3.15, the program's floor, not from the runner's own older Python
      # (saulpatinojr/HCW-HybridCloudWorks#1707). This repository has no
      # .python-version, so the line is written here. No cache: the install
      # is one wheel checked by its hash. Runs after an earlier failure too,
      # like the install step it serves.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: ${{ !cancelled() }}
        with: { python-version: "3.15" }
      - name: Install actionlint, hadolint and zizmor (pinned, digests checked)
        id: lint-tools
        # Runs after an earlier failure in this job too, so one run reports the
        # linters' findings beside whatever else failed.
        if: ${{ !cancelled() }}
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          HADOLINT_VERSION: 2.14.0
          HADOLINT_SHA256: 6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47
          ZIZMOR_VERSION: 1.31.1
          ZIZMOR_SHA256: 58e878eb2dbd2c6183c105e1ac28c14f7dd1eca44a783f1fe2a69647d012c410
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/lint-tools"
          mkdir -p "$tools"
          cd "$tools"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 --retry-all-errors -o "$tarball" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          curl -sSfL --retry 3 --retry-all-errors -o hadolint "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  hadolint" | sha256sum -c -
          chmod 0755 actionlint hadolint
          # zizmor in its own environment: one wheel, one hash, nothing else.
          python3 -m venv zizmor-env
          echo "zizmor==${ZIZMOR_VERSION} --hash=sha256:${ZIZMOR_SHA256}" > zizmor-requirements.txt
          zizmor-env/bin/python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes -r zizmor-requirements.txt
          ln -s "$tools/zizmor-env/bin/zizmor" zizmor
          echo "$tools" >> "$GITHUB_PATH"

      - name: actionlint
        if: ${{ !cancelled() && steps.lint-tools.outcome == 'success' }}
        run: |
          actionlint -version
          actionlint -color

      - name: zizmor
        if: ${{ !cancelled() && steps.lint-tools.outcome == 'success' }}
        run: |
          zizmor --version
          args=(--offline --format=github)
          if [ -f .github/zizmor.yml ]; then args+=(--config .github/zizmor.yml); fi
          zizmor "${args[@]}" .github/workflows

      - name: hadolint
        if: ${{ !cancelled() && steps.lint-tools.outcome == 'success' }}
        run: |
          set -euo pipefail
          hadolint --version
          # Written to a file first, so a failing git stops the step (inside
          # `< <(...)` its failure would be lost and read as "none tracked").
          list="${RUNNER_TEMP}/dockerfiles"
          git ls-files -z -- ':(glob)**/Dockerfile' ':(glob)**/Dockerfile.*' ':(glob)**/*.Dockerfile' > "$list"
          mapfile -d '' files < "$list"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no Dockerfile is tracked; nothing to lint"
            exit 0
          fi
          printf 'linting %s\n' "${files[@]}"
          hadolint --failure-threshold warning --format tty "${files[@]}"

  packed-consumer:
    # The packages the web-front edition and the website install: pack, install from tarballs into an empty project, run, type-check.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26, cache: npm }
      - run: npm ci && npm run build
      - run: node scripts/verify-packed-consumer.mjs

  generated-terraform:
    # Proves the generated bundle (not just the repo's own IaC) passes terraform validate.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26, cache: npm }
      - run: npm ci && npm run build
      - run: node apps/cli/dist/main.js assess --csv samples/resources-csv/sample-resources.csv --out ./out --region westus3
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: "1.9.8" }
      - run: terraform -chdir=out/terraform fmt -recursive   # generated code is normalized, then must validate
      - run: terraform -chdir=out/terraform init -backend=false -input=false
      - run: terraform -chdir=out/terraform validate -no-color
      - run: terraform -chdir=out/terraform/hcp init -backend=false -input=false && terraform -chdir=out/terraform/hcp validate -no-color
      - name: Check generated arguments against the real provider schema
        run: |
          terraform -chdir=out/terraform providers schema -json > /tmp/schema.json
          node scripts/check-generated-arguments.mjs out/terraform/argument-manifest.json /tmp/schema.json

  appliance-image:
    # Builds the appliance image without pushing it, lints the Dockerfile, scans the image and starts it once, so a broken
    # or vulnerable image shows up in the pull request and not at release time. The release workflow repeats the scan.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Lint the Dockerfile (fails on errors; warnings are printed)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with: { dockerfile: infrastructure/docker/Dockerfile.appliance, failure-threshold: error }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (local only, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infrastructure/docker/Dockerfile.appliance
          load: true
          push: false
          tags: amo-appliance:ci
      - name: Scan (HIGH/CRITICAL, fixed only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: "amo-appliance:ci", exit-code: "1", severity: "HIGH,CRITICAL", ignore-unfixed: true }
      - name: The image refuses to start in production without Entra sign-in settings (ticket #51)
        run: |
          if docker run --rm amo-appliance:ci; then echo "the image started without sign-in settings"; exit 1; fi
          out="$(docker run --rm amo-appliance:ci 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "AMO_ENTRA_TENANT_ID and AMO_ENTRA_CLIENT_ID"
      - name: Start the container with placeholder sign-in settings and no secrets, check /api/health
        run: |
          docker run -d --name amo-appliance -p 8081:8081 -e AMO_ENTRA_TENANT_ID=00000000-0000-0000-0000-000000000000 -e AMO_ENTRA_CLIENT_ID=00000000-0000-0000-0000-000000000001 amo-appliance:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/api/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs amo-appliance
          exit 1
