# Actions are pinned to full commit SHAs (version in the trailing comment); Dependabot (github-actions ecosystem) proposes updates.
# Appliance image docker.io/hybridcloudworks/img-mo-appliance-app (program decision 2026-10-09: Docker Hub only, no GHCR;
# REFACTOR_APP.md section 7, optional item taken on 2026-10-10). Order matters: build once and push by digest (no tag) -> scan
# that digest -> tag it. A failing scan gives the image no tag and no attestation. Deployments reference the digest this run
# prints, never a tag.
#
# Two paths, two jobs, and only one of them can reach Docker Hub:
#   - A v* tag push runs build-scan-publish: the Docker OIDC login, the push, the tag, the attestation. It is the ONLY job with
#     id-token: write and attestations: write, and its `if` is the push gate: DOCKERHUB_ENABLED and a refs/tags/v* ref.
#   - A manual run (workflow_dispatch, on main) runs rehearse: it builds the same image into the runner's local Docker, scans
#     it with the same Trivy settings, and stops. It has contents: read only, does no login and pushes nothing. The Docker Home
#     rule for the OIDC connection trusts tag refs only, so a login from main would be refused (400 access_denied, run
#     40254017571): the rehearsal never asks for one.
#
# Login is the Docker OIDC connection, never a long-lived token: docker/login-action v4.5.0+ with no password, registry
# docker.io and DOCKERHUB_OIDC_CONNECTIONID set exchanges a GitHub ID token at identity.docker.com for a short-lived Docker
# access token. The repository variables DOCKERHUB_ENABLED and DOCKERHUB_CONNECTION are owner steps (docs/release/docker-hub.md);
# until they are set the jobs are skipped.
name: publish-images
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
env:
  IMAGE: docker.io/hybridcloudworks/img-mo-appliance-app
  DOCKERHUB_ORG: hybridcloudworks
jobs:
  # The same guard as release-cli.yml (scripts/check-release-version.mjs, ADR-0034): the tag, the package version and main must
  # agree before an image that deployments will reference by digest is built. This workflow is independent of release-cli.yml:
  # both start from the same tag, and the image can be pushed even if the release run fails (and the reverse).
  check:
    if: vars.DOCKERHUB_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: A manual run is only allowed on main
        if: github.event_name != 'push' && github.ref != 'refs/heads/main'
        env: { REF: "${{ github.ref }}" }
        run: |
          echo "::error::a manual run is only allowed on the main branch (this run is on $REF): Run workflow, Branch: main"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26, package-manager-cache: false }
      - name: The tag and every version agree, and the commit is on main
        env: { EVENT_NAME: "${{ github.event_name }}", REF_NAME: "${{ github.ref_name }}" }
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then mode=(--tag "$REF_NAME"); else mode=(--rehearse); fi
          node scripts/check-release-version.mjs "${mode[@]}" --ancestor-of origin/main

  # The manual run: build, prove (scan) and stop. No Docker Hub login, no push, no token request: this job has no id-token and
  # no attestations permission, and its image never leaves the runner. It does not wait for or feed the tag path.
  rehearse:
    needs: check
    if: vars.DOCKERHUB_ENABLED == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read # the checkout, and nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # load: true puts the single-platform image into the runner's local Docker; provenance and SBOM attestations cannot be
      # loaded that way, and the rehearsal publishes nothing to attach them to.
      - id: build
        name: Build the image into the local Docker (nothing is pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infrastructure/docker/Dockerfile.appliance
          load: true
          push: false
          tags: ${{ env.IMAGE }}:rehearsal
          provenance: false
          sbom: false
      - name: Scan the local image (HIGH/CRITICAL, fixed only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: "${{ env.IMAGE }}:rehearsal", exit-code: "1", severity: "HIGH,CRITICAL", ignore-unfixed: true }
      - name: Say what this run did and did not do
        run: |
          {
            echo "Rehearsal only: the image was built and scanned on this runner."
            echo "Nothing was pushed, tagged or attested, and there was no Docker Hub login."
            echo "An image is published only by pushing a v* tag (docs/release/docker-hub.md)."
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # The tag push: the only path that logs in to Docker Hub, pushes, tags and attests. The `if` below is the push gate.
  build-scan-publish:
    needs: check
    if: vars.DOCKERHUB_ENABLED == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the Docker token exchange, and Sigstore's signing certificate
      attestations: write
    steps:
      # Before the builds, so a missing connection ID fails in seconds rather than after them.
      - name: DOCKERHUB_CONNECTION holds a connection ID
        env:
          CONNECTION_ID: ${{ vars.DOCKERHUB_CONNECTION }}
        run: |
          set -euo pipefail
          uuid='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          if [[ ! "$CONNECTION_ID" =~ $uuid ]]; then
            echo "::error::DOCKERHUB_ENABLED is true, but the repository variable DOCKERHUB_CONNECTION is not an OIDC connection ID (a UUID, copied from the connection in Docker Home). See docs/release/docker-hub.md."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false } # nothing below needs the token: the build context is the local checkout
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern=v{{version}}
            type=sha
      # The image is built ONCE. Before, one build was scanned and a second build was pushed, so the pushed bytes were never the
      # scanned bytes (follow-up of issue 83). Now the single build is pushed by digest (no tag), that exact digest is scanned,
      # and only then does it get its tags: the digest scanned, tagged, attested and printed for deployments is one digest.
      # Cost of that order: if the scan fails, an untagged image stays in the repository under its digest; no tag points at it
      # and no attestation is made, and it can be deleted on Docker Hub (docs/release/docker-hub.md).
      - name: Log in to Docker Hub through the OIDC connection (to push the build)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_CONNECTION }}
          DOCKERHUB_OIDC_EXPIREIN: "900"
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_ORG }}
      - id: build
        name: Build once and push by digest, with provenance and SBOM (no tag yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infrastructure/docker/Dockerfile.appliance
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - name: Scan that digest before it gets a tag (HIGH/CRITICAL, fixed only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}", exit-code: "1", severity: "HIGH,CRITICAL", ignore-unfixed: true }
      # A new login after the scan: the first token (900 seconds) may have run out during a long build and scan.
      - name: Log in again to Docker Hub (to tag and attest)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_CONNECTION }}
          DOCKERHUB_OIDC_EXPIREIN: "900"
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_ORG }}
      - name: Tag the scanned digest (the same image, no rebuild)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then args+=(--tag "$tag"); fi
          done <<< "$TAGS"
          test "${#args[@]}" -gt 0
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record the immutable digest for deployments
        env: { DIGEST: "${{ steps.build.outputs.digest }}" }
        run: echo "${IMAGE}@${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"
