# actionlint configuration, read by the lint step in ci.yml
# (HCW-HybridCloudWorks#1575).
#
# ubuntu-26.04 is a GitHub-hosted runner label, not a self-hosted one. It is
# listed here only because actionlint 1.7.12, the release CI pins, predates
# it and reports `label "ubuntu-26.04" is unknown` on every job. Once a
# release carrying the label is pinned, this file can go.
self-hosted-runner:
  labels:
    - ubuntu-26.04
